name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

jobs:
  # Node 22+ is both the toolchain and the supported runtime, so one job
  # covers everything, the smoke test against dist/ included.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:types-pkg
      - run: node scripts/smoke.mjs
