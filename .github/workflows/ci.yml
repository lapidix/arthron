name: CI

on:
  push:
    branches: [main, "v*.x"]
  # Every base branch, `vN.x` maintenance branches included.
  pull_request:

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

jobs:
  # Node 22+ is both the toolchain and the supported runtime, so one job
  # covers everything, the smoke test against dist/ included.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # The runner's cached Node can lag a security release (its 22.23.3
          # and 24.21.0 missed the Brotli fix, CVE-2026-111497): take the
          # newest patch of the line, here and in every job below.
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release PR that bumps the version without notes fails here, before
      # merge, instead of in tag-release.yml after it.
      - name: CHANGELOG.md must have an entry for the version
        run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:types-pkg
      - run: node scripts/smoke.mjs

  # The published types as a user's compiler sees them: every TypeScript
  # version from the supported minimum up, bundler and NodeNext, ESM and CJS,
  # with the DOM lib and with only @types/node. The versions live in
  # test/types-consumer with their own lockfile, so only this job installs them.
  consumer-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/types-consumer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile --dir test/types-consumer
      - run: pnpm check:types-consumer

  # The built package in Chromium, Firefox and WebKit, calling a server on
  # another origin: CORS preflights, opaque redirects, cookies, aborts and
  # streams behave differently there than in Node. Playwright and its
  # browsers live in test/browser, so only this job installs them.
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm install --frozen-lockfile --dir test/browser
      - run: pnpm --dir test/browser exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check:browsers

  # The documentation site builds. VitePress lives in docs/ with its own
  # lockfile, so only this job installs it. The vN.x maintenance branches have
  # no docs/ (this file is copied there), so every step after the check is
  # skipped on them.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: has-docs
        run: |
          if [ -f docs/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has-docs.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.has-docs.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - if: steps.has-docs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile --dir docs
      - if: steps.has-docs.outputs.present == 'true'
        run: pnpm docs:build
