name: Release

# Publishes to npm when a `vX.Y.Z` tag is pushed, via npm Trusted Publishing
# (OIDC) — no token in secrets. One-time setup on npmjs.com:
#   package arthron → Settings → Trusted Publisher → GitHub Actions
#   owner: lapidix · repository: arthron · workflow: release.yml
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers / tag rules for this environment are set in the
    # repository settings (Settings → Environments → npm).
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      # Pinned: this job can publish, so it must not pull whatever is newest.
      - run: npm install -g npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "package.json is $pkg but tag is $tag"; exit 1; }
      - run: npm publish --provenance --access public
