name: Release

# Stages a release on npm when a `vX.Y.Z` tag is pushed, via npm Trusted
# Publishing (OIDC) — no token in secrets. The trusted publisher on npmjs.com
# (package arthron → Settings → Trusted Publisher) is GitHub Actions ·
# lapidix/arthron · release.yml · environment npm, allowed to *stage* only:
# a stolen workflow or action cannot put a version live.
#
# Two human gates: the `npm` environment needs a reviewer's approval before
# this job runs, and the staged version goes live only once a maintainer
# approves it with 2FA — on npmjs.com, or `npm stage list arthron` then
# `npm stage approve <stage-id>`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers / tag rules for this environment are set in the
    # repository settings (Settings → Environments → npm).
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15.0; Node 22 ships an older npm.
      # Pinned: this job can publish, so it must not pull whatever is newest.
      - run: npm install -g npm@12.2.0
      - run: pnpm install --frozen-lockfile
      - name: Tag must match package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "package.json is $pkg but tag is $tag"; exit 1; }
      # Stage only: the trusted publisher refuses a direct `npm publish`.
      - run: npm stage publish --provenance --access public
