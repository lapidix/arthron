name: Docs

# Deploys the documentation site (docs/, VitePress) to GitHub Pages when a
# GitHub Release is published, and only when that release is the repo's
# Latest. A prerelease (2.0.0-rc.1) or a maintenance release (1.2.x on `v1.x`,
# published without the Latest mark) must not overwrite the docs of the newest
# release, so the first step compares the published tag with the Latest tag
# and the rest of the workflow is skipped when they differ.
#
# A `release` event runs this file as it is at the tagged commit, so a tag cut
# before this workflow existed, and any `v1.x` tag, never starts it. The Latest
# check is what guards the prereleases cut from `main`.
#
# `pnpm release:approve` publishes the draft from the maintainer's machine
# with their own token, which is why `release: published` really fires: a
# release published with a workflow's GITHUB_TOKEN would not start this one.
#
# Run by hand (Actions → Docs → Run workflow), it skips that check and deploys
# the ref you pick as it is. The ref must be `main` or a `v*` tag, since the
# `github-pages` environment refuses other branches. From `main` that also
# publishes docs for changes no release carries yet.
#
# Needs Pages set to deploy from GitHub Actions (Settings → Pages). The
# `github-pages` environment that creates allows only the default branch; a
# release runs on a tag ref, so the environment must also allow `v*` tags
# (Settings → Environments → github-pages → Deployment branches and tags),
# or the deploy job is refused. Set this again if the environment is recreated.
on:
  release:
    types: [published]
  workflow_dispatch:

# Nothing here writes to the repo; the deploy job adds what Pages needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages settings; the token otherwise has
    # contents: read only.
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      # The release's tag comes in through env, never spliced into the script.
      - name: Latest release only
        id: gate
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is not the Latest release ($latest) — nothing to deploy"
          fi
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
      # A release event checks out the release's tag, a manual run the ref picked.
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.gate.outputs.deploy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile --dir docs
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.gate.outputs.deploy == 'true'
        run: pnpm docs:build
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # One deployment at a time, and a running one is never cancelled halfway.
    # On this job rather than the workflow: a run that skips (an rc) never
    # reaches it, so it cannot cancel a Latest deploy waiting in the group.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
